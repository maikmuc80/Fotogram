<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotogram – Your personal photo album</title>

  <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
  <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Fotogram" />
  
  <link rel="manifest" href="assets/favicon/site.webmanifest" />
  <link rel="stylesheet" href="style.css">
</head>

<body onload="init()">

  <header class="site-header">
    <div class="header-inner">
      <img src="assets/icons/fotogram-logo.svg" alt="Fotogram Logo" class="logo">
    </div>
  </header>

  <main>
    <h1>Your personal photo album</h1>
    <section id="gallery" class="gallery" aria-label="Fotogalerie">
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <img src="assets/icons/logo-dev.svg" alt="Developer Akademie">
      <p>&copy; 2026 Developer Akademie GmbH</p>
    </div>
  </footer>

  <dialog id="overlay" class="overlay" aria-label="Bild Großansicht">
  </dialog>

  <script src="script.js"></script>
</body>

</html>
